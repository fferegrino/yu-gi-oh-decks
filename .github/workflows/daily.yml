name: Daily dataset download

on:
  workflow_dispatch:
  schedule:
  - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: daily-dataset
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: fferegrino/kaggle-dataset-refresh@v1
      with:
        dataset: ioexception/yugioh-decks
        command: python download.py
        # Decks are only ever appended, so a run that rewrites existing rows is a bug, not an update.
        append-only: "*.csv"
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
