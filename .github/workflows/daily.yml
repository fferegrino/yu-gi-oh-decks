name: Daily dataset download

on:
  workflow_dispatch:
    inputs:
      source:
        description: Where to read the current dataset from
        type: choice
        options: [huggingface, kaggle]
        default: huggingface
  schedule:
  - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: daily-dataset
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: fferegrino/dataset-sync/fetch@v1
      with:
        # Scheduled runs have no inputs, so they always read from Hugging Face.
        from: ${{ inputs.source || 'huggingface' }}
        huggingface-dataset: feregrino/yugioh-decks
        kaggle-dataset: ioexception/yugioh-decks
        kaggle-username: ioexception
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Download new decks
      run: |
        python -m pip install --upgrade pip==26.2.1
        pip install -r requirements.txt
        python download.py
    - uses: fferegrino/dataset-sync/publish@v1
      with:
        huggingface-dataset: feregrino/yugioh-decks
        huggingface-card: dataset-card.md
        kaggle-dataset: ioexception/yugioh-decks
        kaggle-metadata: dataset-metadata.json
        # Decks are only ever appended, so a run that rewrites existing rows is a bug, not an update.
        append-only: "*.csv"
        huggingface-token: ${{ secrets.HF_TOKEN }}
        kaggle-username: ioexception
        kaggle-key: ${{ secrets.KAGGLE_KEY }}
        healthcheck-url: ${{ secrets.HEALTHCHECK_URL }}
    # A failure before publish skips it, and with it publish's own failure ping.
    - uses: fferegrino/dataset-sync/ping@v1
      if: failure()
      with:
        url: ${{ secrets.HEALTHCHECK_URL }}
        status: fail
