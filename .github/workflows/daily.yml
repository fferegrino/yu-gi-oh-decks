name: Daily dataset download

on:
  workflow_dispatch:
  schedule:
  - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: daily-dataset
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip==26.2.1
        pip install -r requirements.txt
    - name: Download dataset
      run: python download.py
    - name: Sort dataset
      run: ./sort_data.sh
    - name: Commit changes
      id: commit
      run: |
        msg="Updated: $(date +'%Y-%m-%d %H:%M')"
        git config user.email "antonio.feregrino+datasets@gmail.com"
        git config user.name "Antonio Feregrino"
        git add data/
        changed=false
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "$msg"
          changed=true
        fi
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        pushed=0
        for attempt in 1 2 3; do
          if git push; then
            pushed=1
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            break
          fi
          echo "git push failed (attempt ${attempt}); syncing main and retrying"
          git fetch origin main
          git rebase origin/main
          sleep $((attempt * 5))
        done
        test "$pushed" -eq 1
    - name: Upload data to Kaggle
      if: steps.commit.outputs.changed == 'true'
      env:
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        KAGGLE_USERNAME: ioexception
      run: python upload_kaggle.py
